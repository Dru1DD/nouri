# Disabled for 1.0.3 — run tests locally (scripts/githooks or Lefthook).
# Re-enable by restoring `push` / `pull_request` triggers.
name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: NouriKit tests
        working-directory: NouriKit
        run: swift test
